name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require production API origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "Missing GitHub Actions repository variable VITE_API_BASE_URL."
            echo "Set it to the Nest API https origin (no /api path, no secrets)."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "VITE_API_BASE_URL must not be localhost for GitHub Pages production builds."
              exit 1
              ;;
            http://*)
              echo "VITE_API_BASE_URL must use https for production builds."
              exit 1
              ;;
            https://*)
              ;;
            *)
              echo "VITE_API_BASE_URL must be an https:// origin."
              exit 1
              ;;
          esac
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
